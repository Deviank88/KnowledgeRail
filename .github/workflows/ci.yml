name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify-${{ matrix.os }}-node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: npm run verify

  installed-package:
    name: installed-package-${{ matrix.os }}-node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, install and exercise stdio, HTTP and desktop entry points
        run: npm run package:smoke

  retrieval-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deterministic quality gates
        run: npm run eval:gates

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scaling benchmark smoke test
        run: npm run bench:scale -- --scales=250 --iterations=3

      - name: MCP protocol benchmark smoke test
        env:
          MCP_BENCH_ITERATIONS: 10
          MCP_BUILD_ITERATIONS: 100
        run: npm run bench:mcp

      - name: Progressive disclosure benchmark smoke test
        env:
          CONTEXT_BENCH_PAGES: 250
          CONTEXT_BENCH_ITERATIONS: 5
          CONTEXT_BENCH_MAX_EVIDENCE: 8
          CONTEXT_BENCH_READ_EVIDENCE: 3
          CONTEXT_BENCH_TOKEN_BUDGET: 2000
        run: npm run bench:context

      - name: Graph runtime locality benchmark
        env:
          GRAPH_RUNTIME_BENCH_SCALES: 1000,10000
          GRAPH_RUNTIME_QUERY_ITERATIONS: 25
          GRAPH_RUNTIME_MUTATION_ITERATIONS: 5
        run: npm run bench:graph-runtime

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production vulnerability gate
        run: npm run audit:runtime

      - name: Registry signature gate
        run: npm run audit:signatures
