name: Publish MCP Registry metadata

# Separate, explicit action: the standard release publishes GitHub and npm only.
on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish MCP Registry metadata for a released tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify selected release metadata
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Require an already published npm package
        run: |
          PACKAGE_SPEC="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          npm view "$PACKAGE_SPEC" version

      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish server metadata to the MCP Registry
        run: |
          MCP_NAME="$(node -p 'require("./package.json").mcpName')"
          MCP_VERSION="$(node -p 'require("./package.json").version')"
          MCP_NAME_PATH="$(node -p 'encodeURIComponent(require("./package.json").mcpName)')"
          if curl --fail --silent --show-error --output /dev/null \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${MCP_NAME_PATH}/versions/${MCP_VERSION}"; then
            echo "$MCP_NAME@$MCP_VERSION is already published; skipping MCP Registry publish."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
